
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What AI Model Are You?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; padding: 20px; font-family: system-ui, sans-serif; }
  .card { background: white; border-radius: 24px; padding: 40px; max-width: 480px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .label { font-size: 13px; font-weight: 700; color: #7c3aed; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; text-align: center; }
  .progress { display: flex; gap: 6px; justify-content: center; margin-bottom: 24px; }
  .pip { height: 4px; width: 32px; border-radius: 4px; background: #e5e7eb; transition: background 0.3s; }
  .pip.done { background: #7c3aed; }
  h2 { font-size: 22px; font-weight: 800; color: #1a1a2e; text-align: center; margin-bottom: 32px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  button.opt { background: #f9fafb; color: #374151; border: 2px solid #e5e7eb; padding: 16px 20px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: left; transition: all 0.2s; width: 100%; }
  button.opt:hover { border-color: #7c3aed; background: #f5f3ff; }
  button.opt.selected { background: #7c3aed; color: white; border-color: #7c3aed; }
  .counter { text-align: center; margin-top: 24px; font-size: 13px; color: #9ca3af; }
  .result { text-align: center; }
  .emoji { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 28px; font-weight: 800; color: #1a1a2e; margin-bottom: 8px; }
  .tagline { font-size: 16px; color: #7c3aed; font-weight: 600; margin-bottom: 20px; font-style: italic; }
  .desc { font-size: 15px; color: #4a5568; line-height: 1.7; margin-bottom: 32px; }
  a.hf { display: inline-block; background: #f3f4f6; color: #374151; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
  button.retry { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const questions = [
  { q: "It's Friday night. What are you doing?", options: [
    { text: "Hosting a dinner party for 20 people", traits: { social: 2 } },
    { text: "Deep in a book, phone on silent", traits: { focused: 2 } },
    { text: "Started 4 projects, finished 0", traits: { chaotic: 2 } },
    { text: "Optimizing my sleep schedule", traits: { efficient: 2 } },
  ]},
  { q: "How do you make decisions?", options: [
    { text: "Gut feeling, always", traits: { chaotic: 2 } },
    { text: "Spreadsheet. Obviously.", traits: { efficient: 2 } },
    { text: "Ask everyone I know", traits: { social: 2 } },
    { text: "Research for 3 weeks then panic", traits: { focused: 2 } },
  ]},
  { q: "Someone gives you a vague task. You:", options: [
    { text: "Just start and figure it out", traits: { chaotic: 2 } },
    { text: "Ask 17 clarifying questions", traits: { focused: 2 } },
    { text: "Delegate immediately", traits: { social: 2 } },
    { text: "Build a framework first", traits: { efficient: 2 } },
  ]},
  { q: "Your ideal workspace is:", options: [
    { text: "Chaos. Organized chaos.", traits: { chaotic: 2 } },
    { text: "Minimalist. One pen. One notebook.", traits: { efficient: 2 } },
    { text: "Open office, lots of people", traits: { social: 2 } },
    { text: "A cave with fast wifi", traits: { focused: 2 } },
  ]},
  { q: "People describe you as:", options: [
    { text: "Unpredictable but always delivers", traits: { chaotic: 2 } },
    { text: "The smartest person in the room", traits: { focused: 2 } },
    { text: "Everyone's favorite person", traits: { social: 2 } },
    { text: "Scarily efficient", traits: { efficient: 2 } },
  ]},
  { q: "Your relationship with rules is:", options: [
    { text: "Rules are suggestions", traits: { chaotic: 2 } },
    { text: "I wrote the rulebook", traits: { focused: 2 } },
    { text: "Rules help everyone get along", traits: { social: 2 } },
    { text: "Rules exist to be optimized", traits: { efficient: 2 } },
  ]},
  { q: "How big is your ego?", options: [
    { text: "Enormous. Justified.", traits: { focused: 2 } },
    { text: "I'm just here to help", traits: { social: 2 } },
    { text: "I don't need validation", traits: { efficient: 2 } },
    { text: "What even is an ego", traits: { chaotic: 2 } },
  ]},
  { q: "Your biggest flex is:", options: [
    { text: "I do more with less", traits: { efficient: 2 } },
    { text: "I've read everything", traits: { focused: 2 } },
    { text: "Everyone loves me", traits: { social: 2 } },
    { text: "I'm impossible to predict", traits: { chaotic: 2 } },
  ]},
];

const results = [
  { match: { chaotic: 1 }, model: "Mistral-7B-Instruct", emoji: "⚡", tagline: "Chaotic, fast, and somehow always right", desc: "Nobody expected you to be this good, but here you are, outperforming models twice your size. You thrive in chaos, move fast, and somehow pull it off every time.", url: "https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.2" },
  { match: { focused: 1 }, model: "DeepSeek-R1", emoji: "🧠", tagline: "You think before you speak. Always.", desc: "You don't just answer, you reason. While everyone else is rushing, you're three steps ahead, working through the problem methodically.", url: "https://huggingface.co/deepseek-ai/DeepSeek-R1" },
  { match: { social: 1 }, model: "Llama-3-8B-Instruct", emoji: "🦙", tagline: "Open, friendly, and everyone loves you", desc: "Open source, community-driven, and beloved by everyone. You show up for people, you're endlessly helpful, and you make everything feel approachable.", url: "https://huggingface.co/meta-llama/Meta-Llama-3-8B-Instruct" },
  { match: { efficient: 1 }, model: "Phi-4", emoji: "🎯", tagline: "Small but absolutely deadly", desc: "You don't need a big team or lots of resources. You just get it done, better than people expect, with less than they think is possible.", url: "https://huggingface.co/microsoft/phi-4" },
  { match: { focused: 1, efficient: 1 }, model: "Qwen2.5-72B-Instruct", emoji: "🔬", tagline: "Brilliant, disciplined, and low-key terrifying", desc: "Methodical, precise, and operating at a scale most people can't comprehend. You have strong opinions and the receipts to back them up.", url: "https://huggingface.co/Qwen/Qwen2.5-72B-Instruct" },
  { match: { social: 1, efficient: 1 }, model: "Gemma-2-9B-IT", emoji: "💎", tagline: "Polished, professional, always put together", desc: "Google's well-behaved overachiever. You're charming, capable, and always dressed for the occasion. People trust you immediately.", url: "https://huggingface.co/google/gemma-2-9b-it" },
  { match: { chaotic: 1, social: 1 }, model: "Mixtral-8x7B", emoji: "🎭", tagline: "Eight personalities, zero apologies", desc: "You contain multitudes. People never quite know which version of you they're getting, but it's always interesting.", url: "https://huggingface.co/mistralai/Mixtral-8x7B-Instruct-v0.1" },
  { match: { focused: 1, chaotic: 1 }, model: "Falcon-180B", emoji: "🦅", tagline: "Enormous, powerful, and a little wild", desc: "Massive, capable, and operating at a scale that makes people nervous. You don't follow trends. You are the trend.", url: "https://huggingface.co/tiiuae/falcon-180B" },
  { match: { efficient: 1, chaotic: 1 }, model: "CodeLlama-7B", emoji: "💻", tagline: "Lives in the terminal, thrives in chaos", desc: "You speak in logic, you think in systems, and you find the chaos of a messy codebase strangely comforting.", url: "https://huggingface.co/codellama/CodeLlama-7b-hf" },
  { match: { social: 1, focused: 1 }, model: "BAAI/bge-large-en", emoji: "🔗", tagline: "You connect everything and everyone", desc: "You find the hidden connections between ideas, people, and concepts that nobody else sees. You're the glue.", url: "https://huggingface.co/BAAI/bge-large-en-v1.5" },
];

let scores = { chaotic: 0, focused: 0, social: 0, efficient: 0 };
let current = 0;

function getResult() {
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const top = sorted[0][0], second = sorted[1][0];
  return results.find(r => { const k = Object.keys(r.match); return k.length === 2 && k.includes(top) && k.includes(second); })
    || results.find(r => Object.keys(r.match).length === 1 && Object.keys(r.match)[0] === top);
}

function renderQuiz() {
  const q = questions[current];
  const pips = questions.map((_, i) => `<div class="pip ${i <= current ? 'done' : ''}"></div>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="label">What AI Model Are You?</div>
    <div class="progress">${pips}</div>
    <h2>${q.q}</h2>
    <div class="options">${q.options.map((opt, i) => `<button class="opt" onclick="answer(${i})">${opt.text}</button>`).join('')}</div>
    <div class="counter">Question ${current + 1} of ${questions.length}</div>
  `;
  window._opts = q.options;
}

function answer(i) {
  document.querySelectorAll('.opt')[i].classList.add('selected');
  setTimeout(() => {
    Object.entries(window._opts[i].traits).forEach(([t, v]) => scores[t] += v);
    current++;
    if (current >= questions.length) renderResult();
    else renderQuiz();
  }, 300);
}

function renderResult() {
  const r = getResult();
  document.getElementById('app').innerHTML = `
    <div class="result">
      <div class="emoji">${r.emoji}</div>
      <div class="label">You are...</div>
      <h1>${r.model}</h1>
      <p class="tagline">"${r.tagline}"</p>
      <p class="desc">${r.desc}</p>
      <a class="hf" href="${r.url}" target="_blank">View on HuggingFace</a><br>
      <button class="retry" onclick="reset()">Retake Quiz</button>
    </div>
  `;
}

function reset() {
  scores = { chaotic: 0, focused: 0, social: 0, efficient: 0 };
  current = 0;
  renderQuiz();
}

renderQuiz();
</script>
</body>
</html>
